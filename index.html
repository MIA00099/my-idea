<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriConnect Pro - Farmer Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
   <script type="module" src="app.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#2bed05',
            darkBg: '#0f172a',
            darkCard: '#1e293b',
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-darkBg font-sans transition-colors duration-300">
  <!-- Header -->
  <header class="flex items-center justify-between p-4 bg-white dark:bg-darkCard shadow-sm sticky top-0 z-50">
    <div class="flex items-center">
      <img src="https://via.placeholder.com/40" alt="AgriConnect Logo" class="w-8 h-8 mr-2 rounded-full">
      <h1 class="text-lg font-bold text-primary">AgriConnect<span class="text-green-400">Pro</span></h1>
    </div>
    <div class="flex items-center space-x-3">
      <button id="themeToggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
        <i class="fas fa-moon"></i>
      </button>
      <img id="userPhoto" src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full border border-green-300" alt="Profile">
    </div>
  </header>

  <!-- Main Content -->
  <main class="p-4 md:p-6 space-y-6">
    <!-- Welcome Banner -->
    <section class="p-6 rounded-xl bg-gradient-to-r from-primary to-green-500 text-white overflow-hidden relative">
      <div class="relative z-10">
        <h2 class="text-2xl font-semibold mb-2">Welcome back, <span id="welcomeName">Loading...</span> 👋</h2>
        <p class="text-sm opacity-90 mb-4">Track your farm progress in real-time</p>
        <div class="grid grid-cols-3 gap-4">
          <div class="bg-white/20 rounded-lg p-3 text-center">
            <p class="text-xs">Active Listings</p>
            <h3 id="activeListings" class="text-xl font-bold">0</h3>
          </div>
          <div class="bg-white/20 rounded-lg p-3 text-center">
            <p class="text-xs">Today's Orders</p>
            <h3 id="todayOrders" class="text-xl font-bold">0</h3>
          </div>
          <div class="bg-white/20 rounded-lg p-3 text-center">
            <p class="text-xs">Earnings</p>
            <h3 id="todayEarnings" class="text-xl font-bold">RWF 0</h3>
          </div>
        </div>
      </div>
    </section>

    <!-- Quick Stats -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="p-5 bg-white dark:bg-darkCard rounded-xl shadow hover:shadow-md transition">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm text-gray-500 dark:text-gray-400">Total Orders</p>
            <h3 id="totalOrders" class="text-2xl font-bold text-gray-800 dark:text-white">0</h3>
          </div>
          <i class="fas fa-shopping-bag text-primary text-xl"></i>
        </div>
      </div>
      <div class="p-5 bg-white dark:bg-darkCard rounded-xl shadow hover:shadow-md transition">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm text-gray-500 dark:text-gray-400">Total Earnings</p>
            <h3 id="totalEarnings" class="text-2xl font-bold text-gray-800 dark:text-white">RWF 0</h3>
          </div>
          <i class="fas fa-coins text-yellow-500 text-xl"></i>
        </div>
      </div>
      <div class="p-5 bg-white dark:bg-darkCard rounded-xl shadow hover:shadow-md transition">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm text-gray-500 dark:text-gray-400">Customer Rating</p>
            <h3 id="customerRating" class="text-2xl font-bold text-gray-800 dark:text-white">4.8</h3>
          </div>
          <i class="fas fa-star text-yellow-400 text-xl"></i>
        </div>
      </div>
      <div class="p-5 bg-white dark:bg-darkCard rounded-xl shadow hover:shadow-md transition">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm text-gray-500 dark:text-gray-400">Active Crops</p>
            <h3 id="activeCrops" class="text-2xl font-bold text-gray-800 dark:text-white">0</h3>
          </div>
          <i class="fas fa-seedling text-primary text-xl"></i>
        </div>
      </div>
    </section>

    <!-- Posted Crops -->
    <section class="bg-white dark:bg-darkCard rounded-xl p-5 shadow">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-white flex items-center">
          <i class="fas fa-leaf text-primary mr-2"></i> My Posted Crops
        </h3>
        <button class="text-gray-500 hover:text-primary text-sm flex items-center">
          <i class="fas fa-sync-alt mr-1"></i> Refresh
        </button>
      </div>
      <div id="postedCrops" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="p-4 border border-gray-200 dark:border-gray-700 rounded-lg animate-pulse">
          <div class="bg-gray-200 dark:bg-gray-600 h-40 rounded-lg mb-3"></div>
          <div class="h-4 bg-gray-200 dark:bg-gray-600 rounded w-3/4 mb-2"></div>
          <div class="h-4 bg-gray-200 dark:bg-gray-600 rounded w-1/2"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Firebase Config, Auth, and Real-Time Data Fetch -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const firebaseConfig = {
  apiKey: "AIzaSyBHgsQPKD3sfPd3Bov-GGLWN0E4PzDA3Rw",
  authDomain: "my-idea-b59e7.firebaseapp.com",
  projectId: "my-idea-b59e7",
  storageBucket: "my-idea-b59e7.firebasestorage.app",
  messagingSenderId: "551780677757",
  appId: "1:551780677757:web:dcdced40d164eebbd31914",
  measurementId: "G-CXNETEQXTJ"
};

      if (typeof firebase !== 'undefined' && firebase.initializeApp) {
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(async (user) => {
          if (user) {
            document.getElementById('welcomeName').innerText = user.displayName || 'Farmer';
            document.getElementById('userPhoto').src = user.photoURL || 'https://via.placeholder.com/40';

            // Fetch real-time farmer stats from Firestore
            const statsRef = db.collection('farmers').doc(user.uid);
            statsRef.onSnapshot((doc) => {
              if (doc.exists) {
                const data = doc.data();
                document.getElementById('totalOrders').innerText = data.totalOrders || 0;
                document.getElementById('totalEarnings').innerText = `RWF ${data.totalEarnings || 0}`;
                document.getElementById('activeCrops').innerText = data.activeCrops || 0;
                document.getElementById('todayOrders').innerText = data.todayOrders || 0;
                document.getElementById('todayEarnings').innerText = `RWF ${data.todayEarnings || 0}`;
              }
            });

            // Fetch real-time crops list
            const cropsRef = db.collection('farmers').doc(user.uid).collection('crops');
            cropsRef.onSnapshot(snapshot => {
              const cropsContainer = document.getElementById('postedCrops');
              cropsContainer.innerHTML = '';
              if (snapshot.empty) {
                cropsContainer.innerHTML = `<p class='text-gray-500 dark:text-gray-400 text-center py-4'>No crops posted yet.</p>`;
              } else {
                snapshot.forEach(doc => {
                  const crop = doc.data();
                  cropsContainer.innerHTML += `
                    <div class='p-4 border border-gray-200 dark:border-gray-700 rounded-lg'>
                      <img src='${crop.image || 'https://via.placeholder.com/200'}' class='h-40 w-full object-cover rounded mb-3' alt='${crop.name}'>
                      <h4 class='text-lg font-semibold text-gray-800 dark:text-white'>${crop.name}</h4>
                      <p class='text-sm text-gray-500 dark:text-gray-400'>${crop.quantity} ${crop.unit} @ RWF ${crop.price}</p>
                    </div>`;
                });
              }
            });

          } else {
            window.location.href = 'login.html';
          }
        });
      } else {
        console.error('Firebase SDK not loaded properly.');
      }
    });
  </script>

  <!-- Dark Mode Toggle -->
  <script>
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      const icon = themeToggle.querySelector('i');
      icon.classList.toggle('fa-moon');
      icon.classList.toggle('fa-sun');
    });
  </script>
</body>
</html>
